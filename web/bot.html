<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReachCare</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    html,body{height:100%}
    body{display:flex;flex-direction:column}
    .stage{flex:1;overflow:hidden;display:flex;flex-direction:column;width:100%;max-width:760px;margin:0 auto;padding:0 20px;min-height:0}
    .bot-intro{padding:36px 0 16px;flex:none}
    .bot-intro h1{font-size:28px}
    .bot-intro p{margin-top:8px;color:var(--muted)}
    .thread{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:8px 0 16px}
    .bubble{max-width:82%;padding:12px 16px;border-radius:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
    .bubble.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
    .bubble.bot{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:4px}
    .bubble small{display:block;margin-bottom:4px;font-size:12px;opacity:.7}
    .bubble audio{display:block;margin-top:10px;width:100%;max-width:320px}
    .sample-heading{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 2px}
    .typing{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
    .dots{display:inline-flex;gap:4px}
    .dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.1s infinite ease-in-out}
    .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
    @media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
    .examples{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 12px}
    .examples button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
    .examples button:hover{background:var(--soft)}
    .composer{display:flex;gap:10px;padding:12px 0 24px;border-top:1px solid var(--line)}
    .composer input{margin:0;flex:1}
    .composer .button{height:42px;white-space:nowrap}
    .rec{background:#b3261e;border-color:#b3261e;color:#fff}
    .note{font-size:12px;color:var(--muted);padding:0 0 12px}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><img src="/reach-mark.png" alt="" width="30" height="33"><span>ReachCare</span></a><nav aria-label="Primary"><a href="/#/plan" data-nav="plan">Plan a clinic</a><a href="/#/docs" data-nav="docs">How it works</a><a href="/bot.html" aria-current="page">Ask ReachCare</a><a href="/join.html">Get alerts</a></nav></header>
  <div class="stage">
    <div class="bot-intro">
      <h1>Find the next free clinic</h1>
      <p>Ask by text or voice, in any language. A text gets a text reply, and a voice note gets a voice reply in the same language.</p>
      <p class="note" id="mode-status" role="status"></p>
      <p class="note" id="ai-status" role="status"></p>
    </div>
    <div id="thread" class="thread" aria-live="polite"></div>
    <div class="examples" id="examples">
      <button type="button">When is the next free blood pressure clinic near Raleigh?</button>
      <button type="button">Diabetes screening in Asheville</button>
      <button type="button">¿Dónde hay una clínica gratuita cerca de Charlotte?</button>
    </div>
    <form id="send" class="composer">
      <input id="text" type="text" placeholder="Ask about a free clinic…" autocomplete="off" aria-label="Your question">
      <button class="button primary" id="go" style="height:42px;padding:0 20px">Send</button>
      <button class="button" type="button" id="mic">Record voice</button>
      <button class="button" type="button" id="reset" title="Forget this conversation and start as a new person">Start over</button>
    </form>
  </div>
  <script>
    const thread = document.getElementById('thread'), text = document.getElementById('text');
    const mic = document.getElementById('mic'), go = document.getElementById('go');
    let busy = false;
    const sender = localStorage.getItem('reach-sender') || ('web-' + Math.random().toString(36).slice(2, 12));
    localStorage.setItem('reach-sender', sender);
    let profile = null;
    try { profile = JSON.parse(sessionStorage.getItem('reachcare-demo-profile') || 'null'); } catch {}
    let hostedPreview = false;
    let modeError = null;
    const modeReady = fetch('/api/clinic-options').then(r => {
      if (!r.ok) throw new Error('Could not check chat mode. Refresh the page and try again.');
      return r.json();
    }).then(options => {
      hostedPreview = !!options.hosted_preview;
      document.getElementById('mode-status').textContent = hostedPreview
        ? 'Hosted preview: answers use proposed plans from this browser. Events are not confirmed, and no iMessages are sent.'
        : 'Local mode: answers use saved plans. Run ./start.sh to also receive and send iMessages through Photon.';
      document.getElementById('ai-status').textContent = options.gemini
        ? 'Gemini helps interpret questions and explain matching clinic plans.'
        : 'Gemini is not configured; clinic questions use a basic lookup. Set GEMINI_API_KEY to enable AI answers.';
      if (hostedPreview) seedExampleConversation();
    }).catch(err => { modeError = err; document.getElementById('mode-status').textContent = err.message; });

    function bubble(who, body, audioUrl, label) {
      const d = document.createElement('div'); d.className = 'bubble ' + (who === 'me' ? 'me' : 'bot');
      if (label) { const caption = document.createElement('small'); caption.textContent = label; d.append(caption); }
      if (body) d.append(document.createTextNode(body));
      if (audioUrl) { const a = document.createElement('audio'); a.controls = true; a.preload = 'none'; a.src = audioUrl; d.append(a); }
      thread.append(d); thread.scrollTop = thread.scrollHeight;
      return d;
    }
    function seedExampleConversation() {
      const heading = document.createElement('div');
      heading.className = 'sample-heading'; heading.textContent = 'Example conversation · preloaded';
      thread.append(heading);
      bubble('me', 'Hello, how are you doing?');
      bubble('bot', "Hi! I'm doing well, thanks for asking. I can help you explore proposed free clinic plans in North Carolina. What would you like to know?");
      bubble('me', '¿Hay clínicas gratuitas cerca de Raleigh?', '/demo-question-es.mp3', 'Voice note · Spanish transcript');
      bubble('bot', 'Puedo ayudarte a explorar planes de clínicas gratuitas cerca de Raleigh. Dime qué servicio necesitas. Las fechas y los lugares propuestos todavía no están confirmados.', '/demo-answer-es.mp3', 'Voice reply · Spanish transcript');
    }
    function typing(label) {
      const d = document.createElement('div'); d.className = 'bubble bot';
      d.innerHTML = '<span class="typing" role="status"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span></span></span>';
      d.querySelector('.typing > span:last-child').textContent = label;
      thread.append(d); thread.scrollTop = thread.scrollHeight;
      return d;
    }
    function setBusy(v) { busy = v; go.disabled = v; mic.disabled = v && mic.textContent === 'Record voice'; text.disabled = v; }

    async function ask(body) {
      await modeReady;
      if (modeError) throw modeError;
      let request = body;
      if (hostedPreview) {
        let plans = [];
        try {
          const saved = JSON.parse(localStorage.getItem('reachcare-demo-plans') || '[]');
          if (Array.isArray(saved)) plans = saved;
        } catch {}
        request = {...body, preview: true, profile, plans};
      }
      const r = await fetch('/api/bot/message', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(request)});
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
      if (hostedPreview && 'profile' in data) {
        profile = data.profile;
        try {
          if (profile) sessionStorage.setItem('reachcare-demo-profile', JSON.stringify(profile));
          else sessionStorage.removeItem('reachcare-demo-profile');
        } catch {}
      }
      return data;
    }
    function audioUrl(data) {
      if (!data.audio_b64) return null;
      const bin = atob(data.audio_b64), buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      return URL.createObjectURL(new Blob([buf], {type: data.audio_mime || 'audio/mp4'}));
    }

    async function sendText(t) {
      if (busy || !t) return;
      document.getElementById('examples')?.remove();
      bubble('me', t); setBusy(true);
      const wait = typing('Finding the next clinic…');
      try {
        const data = await ask({sender, text: t});
        wait.remove(); bubble('bot', data.reply);
      } catch (err) { wait.remove(); bubble('bot', err.message); }
      finally { setBusy(false); text.focus(); }
    }
    document.getElementById('send').addEventListener('submit', e => {
      e.preventDefault(); const t = text.value.trim(); text.value = ''; sendText(t);
    });
    document.getElementById('examples').addEventListener('click', e => {
      if (e.target.tagName === 'BUTTON') sendText(e.target.textContent);
    });

    document.getElementById('reset').addEventListener('click', async () => {
      await ask({sender, reset: true}).catch(() => {}); thread.replaceChildren(); sendText('Hi');
    });
    let rec = null, chunks = [];
    mic.addEventListener('click', async () => {
      if (rec) { rec.stop(); return; }
      if (busy) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({audio: true});
        rec = new MediaRecorder(stream); chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(chunks, {type: rec.mimeType}); rec = null;
          mic.textContent = 'Record voice'; mic.classList.remove('rec');
          document.getElementById('examples')?.remove();
          const mine = bubble('me', '🎙 Voice note'); setBusy(true);
          const wait = typing('Listening to your voice note…');
          try {
            const b64 = await new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result.split(',')[1]); f.readAsDataURL(blob); });
            const data = await ask({sender, audio_b64: b64, mime: blob.type});
            mine.textContent = ''; mine.append(document.createTextNode('🎙 ' + data.transcript));
            wait.remove(); bubble('bot', data.reply, audioUrl(data));
          } catch (err) { wait.remove(); bubble('bot', err.message); }
          finally { setBusy(false); }
        };
        rec.start(); mic.textContent = 'Stop and send'; mic.classList.add('rec');
      } catch { bubble('bot', 'Microphone access was blocked. Allow it in your browser and try again.'); }
    });
  </script>
</body>
</html>
